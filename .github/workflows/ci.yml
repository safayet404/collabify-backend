name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: safayet404/leakfix@v0.2.0

  docker:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start API + MongoDB
        run: |
          # Throwaway secrets that exist only for this run, kept for the later steps
          # (docker compose reads them again) and masked in the logs.
          for name in JWT_SECRET JWT_REFRESH_SECRET; do
            value=$(openssl rand -hex 48)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done
          docker compose up --build --detach --wait
      - name: Health check
        run: curl --fail --silent http://localhost:5000/health
      - name: Auth route reaches the database
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"email":"nobody@example.com","password":"x"}' \
            http://localhost:5000/api/auth/login)
          echo "login → $code"; test "$code" = 401
      - name: Logs
        if: always()
        run: docker compose logs api
